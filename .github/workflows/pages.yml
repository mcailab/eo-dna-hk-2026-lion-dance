name: Render MP4 and publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CHUNKS: 8

jobs:
  render:
    name: render chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg (prebuilt, fast)
        id: ff
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (fallback if the fast download failed)
        if: steps.ff.outcome == 'failure'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install exporter
        run: npm install --no-audit --no-fund
      - name: Render this chunk (1/8 of the frames)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node scripts/export.mjs "http://localhost:8080/index.html?render" "seg-${{ matrix.chunk }}.mp4" 30 ${{ matrix.chunk }} ${{ env.CHUNKS }}
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.chunk }}
          path: seg-${{ matrix.chunk }}.mp4
          retention-days: 1

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (prebuilt, fast)
        id: ff
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (fallback if the fast download failed)
        if: steps.ff.outcome == 'failure'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          merge-multiple: true
      - name: Join chunks into one MP4
        run: |
          for i in $(seq 0 $((CHUNKS-1))); do echo "file 'seg-$i.mp4'" >> list.txt; done
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy joined.mp4
          # thumbnail = Hong Kong finale frame (4.5 s before the end), also embedded as the MP4 cover
          ffmpeg -v error -sseof -4.5 -i joined.mp4 -frames:v 1 -q:v 2 thumbnail.jpg
          ffmpeg -v error -i joined.mp4 -i thumbnail.jpg -map 0 -map 1 -c copy -disposition:v:1 attached_pic -movflags +faststart eo-25-chapters-1080p.mp4
          # SHARE version: opens on the HK title frame for 1 s so chat apps / Finder show it as the thumbnail
          ffmpeg -v error -loop 1 -framerate 30 -t 1 -i thumbnail.jpg -i joined.mp4 -filter_complex "[0:v]scale=1920:1080,format=yuv420p,setsar=1[a];[1:v:0]format=yuv420p,setsar=1[b];[a][b]concat=n=2:v=1:a=0[v]" -map "[v]" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p share-tmp.mp4
          ffmpeg -v error -i share-tmp.mp4 -i thumbnail.jpg -map 0 -map 1 -c copy -disposition:v:1 attached_pic -movflags +faststart eo-25-chapters-1080p-SHARE.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 eo-25-chapters-1080p.mp4
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html chapters.json eo-25-chapters-1080p.mp4 eo-25-chapters-1080p-SHARE.mp4 thumbnail.jpg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
