name: Render MP4 and publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CHUNKS: 8

jobs:
  render:
    name: render chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg (prebuilt, fast)
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install exporter
        run: npm install --no-audit --no-fund
      - name: Render this chunk (1/8 of the frames)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node scripts/export.mjs "http://localhost:8080/index.html?render" "seg-${{ matrix.chunk }}.mp4" 30 ${{ matrix.chunk }} ${{ env.CHUNKS }}
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.chunk }}
          path: seg-${{ matrix.chunk }}.mp4
          retention-days: 1

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (prebuilt, fast)
        uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          merge-multiple: true
      - name: Join chunks into one MP4
        run: |
          for i in $(seq 0 $((CHUNKS-1))); do echo "file 'seg-$i.mp4'" >> list.txt; done
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy -movflags +faststart eo-25-chapters-1080p.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 eo-25-chapters-1080p.mp4
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html chapters.json eo-25-chapters-1080p.mp4 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
