name: Render MP4 and publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg and CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install exporter
        run: npm install --no-audit --no-fund
      - name: Render the 1080p MP4 (frame by frame in headless Chrome)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          npm run export
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html chapters.json eo-25-chapters-1080p.mp4 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
